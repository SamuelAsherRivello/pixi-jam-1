<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/css/styles.css" />
    <title>PixiJS Jam #1</title>
  </head>
  <body>
    <div id="buttons">
      <button onclick="setCanvasConfig(1)">1</button>
      <button onclick="setCanvasConfig(2)">2</button>
      <button onclick="setCanvasConfig(4)">4</button>
    </div>
    <div id="status" style="position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:1002;background:rgba(0,0,0,0.7);color:#fff;padding:4px 8px;border-radius:6px;font:12px Arial;">Initializing...</div>
    <div id="canvas-container"></div>
    <script type="module">
      let apps = [];
      let createAndInitializeAppFn = null;
      const statusEl = document.getElementById('status');

      function setStatus(message, isError = false) {
        if (!statusEl) return;
        statusEl.textContent = message;
        statusEl.style.background = isError ? 'rgba(160,0,0,0.85)' : 'rgba(0,0,0,0.7)';
      }

      async function ensureClientBootstrap() {
        if (typeof createAndInitializeAppFn === 'function') {
          return;
        }

        const mod = await import('../src/scripts/client/client.ts');
        createAndInitializeAppFn = mod.createAndInitializeApp || window.createAndInitializeApp;

        if (typeof createAndInitializeAppFn !== 'function') {
          throw new Error('createAndInitializeApp was not exported by client module');
        }
      }

      window.addEventListener('error', (event) => {
        setStatus(`Runtime error: ${event.message}`, true);
      });

      window.addEventListener('unhandledrejection', (event) => {
        const reason = event.reason?.message || String(event.reason);
        setStatus(`Init failed: ${reason}`, true);
      });

      async function setCanvasConfig(count) {
        setStatus(`Initializing ${count} view(s)...`);

        try {
          await ensureClientBootstrap();
        } catch (error) {
          const message = error?.message || String(error);
          setStatus(`Init failed: ${message}`, true);
          throw error;
        }

        const container = document.getElementById('canvas-container');
        container.innerHTML = '';
        container.className = `canvas-count-${count}`;
        for (let app of apps) {
          if (app && typeof app.destroy === 'function') {
            app.destroy();
          }
        }
        apps = [];
        for (let i = 0; i < count; i++) {
          const canvas = document.createElement('canvas');
          canvas.id = `pixi-application-canvas-${i}`;
          container.appendChild(canvas);
        }
        await new Promise((resolve) => setTimeout(resolve, 0));

        try {
          for (let i = 0; i < count; i++) {
            const app = await createAndInitializeAppFn(`pixi-application-canvas-${i}`);
            apps.push(app);
          }
          setStatus(`Ready (${count} view(s))`);
        } catch (error) {
          const message = error?.message || String(error);
          setStatus(`Init failed: ${message}`, true);
          throw error;
        }
      }

      // Inline onclick handlers call window.setCanvasConfig.
      window.setCanvasConfig = setCanvasConfig;

      window.onload = () => setCanvasConfig(1);
    </script>
  </body>
</html>
